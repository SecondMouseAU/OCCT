<text x="24" y="40" font-size="26" font-weight="700" fill="#1a1a1a">Fillet and chamfer ending at a tangent edge pair: before and after the change</text>
<text x="24" y="68" font-size="15" fill="#555">One dot per run. Models of the open reports (#1569, #694, #691, #692, #899, #900, #1571, edge numbers as DRAW explode s e, size 1) and a block with a half cylinder roof built from primitives.</text>
<text x="24" y="88" font-size="15" fill="#555">Left: faults found by the boolean analyzer on the result. Right: largest vertex tolerance of the result. A hollow dot at the left end: the builder declined (IsDone false). An arrow marks a value beyond the axis.</text>
